[project]
name = "invest-calculator"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "altair>=6",
    "ipykernel>=6.30.1",
    "marimo[lsp]>=0.19",
    "millify>=0.1.1",
    "numpy>=2.4",
    "plotly>=6.3.0",
    "polars>=1.36",
    "pyarrow>=22",
    "ruff>=0.14.10",
    "streamlit>=1.48.1",
]


[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"


[tool.setuptools.packages.find]
where = ["."]  # CHANGED: tells setuptools to look in project root
include = ["src*"]  # CHANGED: include the src packages
